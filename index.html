<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>tinyspace</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#0f1419;--panel:#171d24;--card:#1c232c;--border:#2a323d;
    --text:#e6edf3;--muted:#8b97a3;--brand:#4f8cff;--brand2:#7c5cff;
    --ok:#2ecc71;--warn:#f5a623;--err:#ff5c5c;--chip:#232c36;
  }
  html,body{background:var(--bg);color:var(--text);font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;font-size:14px}
  a{color:var(--brand);text-decoration:none}a:hover{text-decoration:underline}
  button{font-family:inherit;cursor:pointer;border:none;outline:none}
  input,textarea,select{font-family:inherit;font-size:14px;color:var(--text);background:var(--card);border:1px solid var(--border);border-radius:8px;padding:9px 12px;outline:none}
  input:focus,textarea:focus,select:focus{border-color:var(--brand)}
  textarea{resize:vertical;min-height:80px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 14px;border-radius:8px;font-weight:600;transition:.15s;background:var(--chip);color:var(--text);border:1px solid var(--border)}
  .btn:hover{background:#2f3844}
  .btn-primary{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;border:none}
  .btn-primary:hover{filter:brightness(1.08)}
  .btn-danger{background:#3a1f24;color:var(--err);border:1px solid #4d282f}
  .btn-danger:hover{background:#4d282f}
  .btn-ghost{background:transparent}
  .container{max-width:1180px;margin:0 auto;padding:0 20px}
  /* Header */
  .header{position:sticky;top:0;z-index:50;background:rgba(15,20,25,.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
  .header-inner{display:flex;align-items:center;gap:18px;height:58px}
  .logo{font-size:19px;font-weight:800;background:linear-gradient(135deg,var(--brand),var(--brand2));-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:.5px}
  .search{display:flex;align-items:center;gap:8px;flex:1;max-width:460px;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:6px 12px}
  .search input{border:none;background:transparent;flex:1;padding:4px}
  .search input:focus{border:none}
  .nav{display:flex;gap:6px;margin-left:auto}
  .nav .btn{padding:6px 12px;font-size:13px}
  /* Hero */
  .hero{padding:46px 0 28px;text-align:center}
  .hero h1{font-size:34px;font-weight:800;line-height:1.2}
  .hero h1 span{background:linear-gradient(135deg,var(--brand),var(--brand2));-webkit-background-clip:text;background-clip:text;color:transparent}
  .hero p{color:var(--muted);margin-top:12px;font-size:15px}
  /* Tool grid */
  .section-title{display:flex;align-items:center;justify-content:space-between;margin:24px 0 16px}
  .section-title h2{font-size:19px;font-weight:700}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}
  .tool-card{background:var(--panel);border:1px solid var(--border);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;transition:.2s}
  .tool-card:hover{border-color:#3a4552;transform:translateY(-3px);box-shadow:0 8px 24px rgba(0,0,0,.25)}
  .tool-card .icon{height:120px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#1c2530,#232d39);font-size:46px}
  .tool-card .body{padding:14px 16px;flex:1;display:flex;flex-direction:column;gap:8px}
  .tool-card .name{font-weight:700;font-size:16px}
  .tool-card .meta{color:var(--muted);font-size:12px;display:flex;gap:12px;flex-wrap:wrap}
  .tool-card .meta b{color:var(--text);font-weight:600}
  .tool-card .actions{display:flex;gap:8px;margin-top:auto;padding-top:10px}
  .tool-card .actions .btn{flex:1;padding:7px 0;font-size:13px}
  /* Modal */
  .modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;display:none;align-items:center;justify-content:center;padding:20px}
  .modal-mask.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--border);border-radius:18px;width:100%;max-width:720px;max-height:86vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.5)}
  .modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--panel);z-index:2;border-radius:18px 18px 0 0}
  .modal-head h3{font-size:17px;font-weight:700}
  .modal-body{padding:20px}
  .modal-foot{display:flex;justify-content:flex-end;gap:10px;padding:14px 20px;border-top:1px solid var(--border)}
  .close{background:transparent;color:var(--muted);font-size:22px;line-height:1;padding:4px 8px;border-radius:6px}
  .close:hover{background:var(--chip);color:var(--text)}
  /* Detail */
  .detail-icon{width:88px;height:88px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:40px;background:linear-gradient(135deg,#1c2530,#232d39);margin-bottom:14px}
  .detail-meta{display:flex;gap:18px;color:var(--muted);font-size:13px;margin:10px 0 16px;flex-wrap:wrap}
  .detail-meta b{color:var(--text)}
  .readme{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;line-height:1.7;color:#d3dbe2;font-size:14px;white-space:pre-wrap;word-break:break-word}
  .readme h1,.readme h2,.readme h3{color:var(--text);margin:10px 0 6px}
  .readme code{background:#0f1419;padding:1px 5px;border-radius:4px;font-size:13px}
  .readme pre{background:#0f1419;padding:12px;border-radius:8px;overflow:auto;margin:8px 0}
  .readme a{color:var(--brand)}
  .readme ul,.readme ol{padding-left:22px;margin:6px 0}
  /* Comments */
  .comments{margin-top:22px;border-top:1px solid var(--border);padding-top:18px}
  .comments h4{font-size:15px;margin-bottom:12px}
  .comment{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:10px}
  .comment .c-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
  .comment .c-from{color:var(--muted);font-size:12px}
  .comment .c-text{font-size:14px;line-height:1.6;white-space:pre-wrap}
  .comment-form{display:flex;flex-direction:column;gap:8px;margin-top:6px}
  .comment-form .row{display:flex;gap:8px}
  .comment-form input{flex:1}
  /* Toast */
  .toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--panel);border:1px solid var(--border);color:var(--text);padding:12px 20px;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.4);opacity:0;transition:.25s;z-index:200;font-size:14px;display:flex;align-items:center;gap:8px}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast.ok{border-color:#2a4d36}.toast.ok .dot{background:var(--ok)}
  .toast.err{border-color:#4d282f}.toast.err .dot{background:var(--err)}
  .toast .dot{width:8px;height:8px;border-radius:50%;background:var(--brand)}
  /* Admin */
  .admin{display:flex;gap:0;min-height:calc(100vh - 58px)}
  .sidebar{width:220px;background:var(--panel);border-right:1px solid var(--border);padding:16px 10px;flex-shrink:0}
  .sidebar .brand{font-size:13px;color:var(--muted);padding:0 10px 12px;border-bottom:1px solid var(--border);margin-bottom:10px}
  .sidebar a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;color:var(--muted);font-size:14px;margin-bottom:2px;font-weight:500}
  .sidebar a:hover{background:var(--chip);color:var(--text);text-decoration:none}
  .sidebar a.active{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff}
  .sidebar a .ic{font-size:16px;width:20px;text-align:center}
  .main{flex:1;padding:24px 28px;min-width:0}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:22px}
  .stat{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:18px}
  .stat .n{font-size:28px;font-weight:800}
  .stat .l{color:var(--muted);font-size:13px;margin-top:4px}
  .panel{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:20px}
  .panel h3{font-size:16px;font-weight:700;margin-bottom:14px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--border)}
  th{color:var(--muted);font-weight:600;font-size:12px;letter-spacing:.3px;text-transform:uppercase;background:var(--card)}
  tr:last-child td{border-bottom:none}
  td .btn{padding:5px 10px;font-size:12px}
  .empty{text-align:center;color:var(--muted);padding:40px 0}
  .empty .big{font-size:40px;margin-bottom:10px}
  .form-row{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
  .form-row label{font-size:13px;color:var(--muted);font-weight:600}
  .form-row .hint{font-size:12px;color:var(--muted)}
  .icon-pick{display:flex;gap:10px;align-items:center}
  .icon-pick .prev{width:56px;height:56px;border-radius:12px;background:linear-gradient(135deg,#1c2530,#232d39);display:flex;align-items:center;justify-content:center;font-size:26px;border:1px solid var(--border)}
  .tag{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11px;background:var(--chip);color:var(--muted);margin-left:6px}
  .login-wrap{display:flex;align-items:center;justify-content:center;min-height:calc(100vh - 58px);padding:20px}
  .login{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:28px;width:100%;max-width:380px}
  .login h2{font-size:20px;margin-bottom:18px;text-align:center}
  .login .form-row{margin-bottom:16px}
  .login .btn{width:100%;padding:11px}
  .badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:600;background:#1f3326;color:var(--ok)}
  .badge.err{background:#3a1f24;color:var(--err)}
  .flex-between{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .toolbar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
  .toolbar input{flex:1;min-width:200px}
  .announce-box{background:linear-gradient(135deg,#1c2530,#211c30);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:18px;display:flex;gap:10px;align-items:flex-start}
  .announce-box .pin{font-size:20px}
  .announce-box .txt{font-size:13px;color:#cdd6df;line-height:1.6}
  .footer{color:var(--muted);text-align:center;font-size:12px;padding:30px 0 20px}
  @media(max-width:760px){
    .sidebar{display:none}
    .grid{grid-template-columns:1fr}
    .search{display:none}
  }
</style>
</head>
<body>

<!-- ============ 前台顶部 ============ -->
<header class="header" id="header" style="display:none">
  <div class="container header-inner">
    <div class="logo" id="siteLogo">tinyspace</div>
    <div class="search">
      <span>🔍</span>
      <input id="searchInput" placeholder="搜索工具名称…">
    </div>
    <nav class="nav">
      <button class="btn btn-ghost" onclick="showHome()">首页</button>
      <button class="btn btn-ghost" id="adminEnterBtn" onclick="enterAdmin()">后台管理</button>
    </nav>
  </div>
</header>

<!-- ============ 前台首页 ============ -->
<section class="container" id="homeView">
  <div class="hero">
    <h1>发现实用工具，<span>一键赞助下载</span></h1>
    <p id="heroSub">优质工具聚合展示平台 · 由后台管理维护内容与下载链接</p>
  </div>
  <div class="announce-box" id="announceBox" style="display:none">
    <div class="pin">📢</div>
    <div class="txt" id="announceTxt"></div>
  </div>
  <div class="section-title"><h2>全部工具</h2><span class="muted" id="toolCount" style="color:var(--muted);font-size:13px"></span></div>
  <div class="grid" id="toolGrid"></div>
  <div class="footer">© <span id="footYear"></span> 2026.08.25 17：39</div>
</section>

<!-- ============ 工具详情弹窗 ============ -->
<div class="modal-mask" id="detailMask">
  <div class="modal">
    <div class="modal-head">
      <h3 id="detailTitle">工具详情</h3>
      <button class="close" onclick="closeModal('detailMask')">✕</button>
    </div>
    <div class="modal-body" id="detailBody"></div>
  </div>
</div>

<!-- ============ 后台登录 ============ -->
<section class="login-wrap" id="loginView" style="display:none">
  <div class="login">
    <h2>🔒 后台管理登录</h2>
    <div class="form-row">
      <label>管理员账号</label>
      <input id="loginUser" placeholder="admin">
    </div>
    <div class="form-row">
      <label>密码</label>
      <input id="loginPass" type="password" placeholder="密码">
    </div>
    <button class="btn btn-primary" onclick="doLogin()">登 录</button>
    <p style="color:var(--muted);font-size:12px;margin-top:14px;text-align:center">欢迎</p>
  </div>
</section>

<!-- ============ 后台管理 ============ -->
<section class="admin" id="adminView" style="display:none">
  <aside class="sidebar">
    <div class="brand">⚡ 后台管理</div>
    <a href="#" class="active" data-view="dash" onclick="switchAdmin('dash',this)"><span class="ic">📊</span>数据面板</a>
    <a href="#" data-view="logs" onclick="switchAdmin('logs',this)"><span class="ic">📋</span>日志</a>
    <a href="#" data-view="publish" onclick="switchAdmin('publish',this)"><span class="ic">➕</span>工具上架</a>
    <a href="#" data-view="tools" onclick="switchAdmin('tools',this)"><span class="ic">🛠️</span>工具管理</a>
    <a href="#" data-view="comments" onclick="switchAdmin('comments',this)"><span class="ic">💬</span>评论管理</a>
    <a href="#" data-view="announce" onclick="switchAdmin('announce',this)"><span class="ic">📢</span>公告</a>
    <div style="margin-top:18px;border-top:1px solid var(--border);padding-top:12px">
      <a href="#" onclick="logout()" style="color:var(--muted)"><span class="ic">🚪</span>退出登录</a>
    </div>
  </aside>
  <div class="main">
    <!-- 数据面板 -->
    <div id="view-dash">
      <div class="stats">
        <div class="stat"><div class="n" id="stVisits">0</div><div class="l">今日访问量</div></div>
        <div class="stat"><div class="n" id="stTools">0</div><div class="l">工具数量</div></div>
        <div class="stat"><div class="n" id="stDowns">0</div><div class="l">累计下载量</div></div>
        <div class="stat"><div class="n" id="stCmts">0</div><div class="l">评论总数</div></div>
      </div>
      <div class="panel">
        <h3>📈 最近动态</h3>
        <div id="recentLogs" class="empty"><div class="big">📭</div>暂无日志记录</div>
      </div>
    </div>
    <!-- 日志 -->
    <div id="view-logs" style="display:none">
      <div class="panel">
        <div class="flex-between" style="margin-bottom:14px"><h3 style="margin:0">系统日志</h3><button class="btn btn-danger" onclick="clearLogs()">清空日志</button></div>
        <div id="logsTable"></div>
      </div>
    </div>
    <!-- 工具上架 -->
    <div id="view-publish" style="display:none">
      <div class="panel">
        <h3 id="pubTitle">➕ 工具上架</h3>
        <div class="form-row"><label>工具名称</label><input id="f-name" placeholder="例如：GitHub 加速下载器"></div>
        <div class="form-row"><label>工具图标</label>
          <div class="icon-pick">
            <div class="prev" id="f-iconPrev">📦</div>
            <input id="f-icon" placeholder="输入 emoji 作为图标，如 🚀" value="📦" oninput="document.getElementById('f-iconPrev').textContent=this.value||'📦'">
          </div>
        </div>
        <div class="form-row"><label>赞助下载链接（用户点击「赞助下载」后跳转此链接）</label><input id="f-link" placeholder="https://example.com/download/xxx"></div>
        <div class="form-row"><label>README.md（支持基础 Markdown 语法）</label><textarea id="f-readme" placeholder="支持 # 标题、**加粗**、`代码`、[链接](url)、- 列表 等基础语法" style="min-height:180px"></textarea></div>
        <div style="display:flex;gap:10px">
          <button class="btn btn-primary" id="pubBtn" onclick="saveTool()">发布工具</button>
          <button class="btn" onclick="resetPubForm()">重置表单</button>
        </div>
        <p class="hint" style="color:var(--muted);font-size:12px;margin-top:12px">💡 提示：下载量会在每次用户真实点击「赞助下载」跳转后自动 +1（基于真实跳转行为统计，拒绝模拟）。</p>
      </div>
    </div>
    <!-- 工具管理 -->
    <div id="view-tools" style="display:none">
      <div class="panel">
        <h3>工具管理</h3>
        <div id="toolsTable"></div>
      </div>
    </div>
    <!-- 评论管理 -->
    <div id="view-comments" style="display:none">
      <div class="panel">
        <h3>用户评论</h3>
        <div id="commentsTable"></div>
      </div>
    </div>
    <!-- 公告 -->
    <div id="view-announce" style="display:none">
      <div class="panel">
        <h3>📢 首页公告</h3>
        <div class="form-row"><label>公告内容（留空则不显示）</label><textarea id="f-announce" placeholder="例如：欢迎来到工具聚合平台！新工具持续上架中…"></textarea></div>
        <button class="btn btn-primary" onclick="saveAnnounce()">保存公告</button>
      </div>
    </div>
  </div>
</section>

<!-- ============ Toast ============ -->
<div class="toast" id="toast"><span class="dot"></span><span id="toastTxt">提示</span></div>

<script>
/* =========================================================
   工具聚合平台 —— 单文件网页应用
   数据存储：localStorage（纯前端实现，无后端依赖）
   拒绝模拟：下载量仅在用户真实点击「赞助下载」跳转时 +1
   ========================================================= */
(function(){
  // ---------- 配置：可在此修改默认管理员账号 ----------
  const ADMIN_USER = "kali";
  const ADMIN_PASS = "anonymouskali12";
  // -----------------------------------------------------

  const KEY = "qxb_tool_platform_v1";
  const state = load();

  function load(){
    try{
      const raw = localStorage.getItem(KEY);
      if(raw){ const o=JSON.parse(raw); initState(o); return o; }
    }catch(e){}
    return newState();
  }
  function newState(){
    return {
      tools:[], logs:[], comments:[], announce:"",
      visitDate:"", visitCount:0,
      _seq:1
    };
  }
  function initState(o){
    if(!Array.isArray(o.tools)) o.tools=[];
    if(!Array.isArray(o.logs)) o.logs=[];
    if(!Array.isArray(o.comments)) o.comments=[];
    if(typeof o.announce!=="string") o.announce="";
    if(typeof o.visitDate!=="string") o.visitDate="";
    if(typeof o.visitCount!=="number") o.visitCount=0;
    if(typeof o._seq!=="number") o._seq=1;
  }
  function save(){ localStorage.setItem(KEY, JSON.stringify(state)); }

  function todayStr(){ const d=new Date(); return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate(); }

  // 访问量统计（按天重置为当日计数）
  function tickVisit(){
    const t=todayStr();
    if(state.visitDate!==t){ state.visitDate=t; state.visitCount=0; }
    state.visitCount++;
    save();
  }
  function addLog(action, detail){
    state.logs.unshift({ id:state._seq++, time:new Date().toLocaleString(), action, detail });
    if(state.logs.length>200) state.logs.length=200;
    save();
  }
  function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }

  // 极简 Markdown -> HTML（仅支持基础语法，拒绝引入外部库）
  function md(text){
    if(!text) return "<p style='color:var(--muted)'>暂无 README 内容</p>";
    let s = text.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    s = s.replace(/^### (.*)$/gm,"<h3>$1</h3>")
         .replace(/^## (.*)$/gm,"<h2>$1</h2>")
         .replace(/^# (.*)$/gm,"<h1>$1</h1>")
         .replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>")
         .replace(/`([^`]+)`/g,"<code>$1</code>")
         .replace(/!\[[^\]]*\]\(([^)]+)\)/g,'<img src="$1" style="max-width:100%;border-radius:8px;margin:8px 0">')
         .replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
    // 列表
    s = s.replace(/(?:^- (.+)$)+/gm, function(block){
        const items = block.trim().split(/\n/).map(l=>l.replace(/^- /,"")).filter(Boolean);
        return "<ul>"+items.map(i=>"<li>"+i+"</li>").join("")+"</ul>";
      });
    // 段落（非标签行合并）
    const lines = s.split("\n");
    let out="", inBlock=false;
    for(const ln of lines){
      if(/^<(\/)?(h[1-3]|ul|ol|li|pre|img|blockquote)/.test(ln)){ out+=ln; inBlock=false; }
      else if(ln.trim()===""){ inBlock=false; }
      else{ out += (inBlock?" ":"<p>")+ln+(inBlock?"":"</p>"); inBlock=true; }
    }
    return out;
  }

  // 工具函数：格式化日期
  function fmtDate(s){ if(!s) return "—"; try{ return new Date(s).toLocaleDateString(); }catch(e){return s;} }

  // 渲染：前台工具卡片
  function renderTools(filter){
    const grid=document.getElementById("toolGrid");
    let list=state.tools.slice().sort((a,b)=>b.createdAt-a.createdAt);
    if(filter){ const q=filter.toLowerCase(); list=list.filter(t=>t.name.toLowerCase().includes(q)); }
    document.getElementById("toolCount").textContent = list.length+" 个工具";
    if(list.length===0){
      grid.innerHTML='<div class="empty" style="grid-column:1/-1"><div class="big">📭</div>'+(filter?"无匹配工具":"暂无工具，管理员可前往后台上架")+'</div>';
      return;
    }
    grid.innerHTML=list.map(t=>`
      <div class="tool-card">
        <div class="icon">${esc(t.icon||"📦")}</div>
        <div class="body">
          <div class="name">${esc(t.name)}</div>
          <div class="meta">
            <span>📅 ${fmtDate(t.createdAt)}</span>
            <span>⬇️ <b>${t.downloads||0}</b></span>
          </div>
          <div class="actions">
            <button class="btn" onclick="openDetail('${t.id}')">详情</button>
            <button class="btn btn-primary" onclick="sponsorDownload('${t.id}')">赞助下载</button>
          </div>
        </div>
      </div>`).join("");
  }
  function esc(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

  // 详情弹窗
  window.openDetail=function(id){
    const t=state.tools.find(x=>x.id===id); if(!t) return;
    document.getElementById("detailTitle").textContent=t.name;
    document.getElementById("detailBody").innerHTML=`
      <div class="detail-icon">${esc(t.icon||"📦")}</div>
      <div class="detail-meta">
        <span>发布：<b>${fmtDate(t.createdAt)}</b></span>
        <span>下载量：<b>${t.downloads||0}</b></span>
      </div>
      <div class="readme">${md(t.readme||"")}</div>
      <div class="comments">
        <h4>💬 评论区（${state.comments.filter(c=>c.toolId===id).length}）</h4>
        <div id="commentList"></div>
        <div class="comment-form">
          <div class="row">
            <input id="c-name" placeholder="昵称">
            <input id="c-from" placeholder="来源工具（自动）" value="${esc(t.name)}" readonly style="flex:.6;color:var(--muted)">
          </div>
          <textarea id="c-text" placeholder="发表评论…"></textarea>
          <button class="btn btn-primary" style="align-self:flex-end" onclick="postComment('${t.id}')">发表评论</button>
        </div>
      </div>`;
    renderComments(id);
    openModal("detailMask");
  };
  function renderComments(toolId){
    const box=document.getElementById("commentList"); if(!box) return;
    const list=state.comments.filter(c=>c.toolId===toolId).sort((a,b)=>b.time-a.time);
    if(list.length===0){ box.innerHTML='<div style="color:var(--muted);font-size:13px;padding:10px 0">暂无评论</div>'; return; }
    box.innerHTML=list.map(c=>`
      <div class="comment">
        <div class="c-head"><b>${esc(c.name||"匿名")}</b><span class="c-from">${esc(c.from||"")} · ${fmtDate(c.time)}</span></div>
        <div class="c-text">${esc(c.text)}</div>
      </div>`).join("");
  }
  window.postComment=function(toolId){
    const name=document.getElementById("c-name").value.trim()||"匿名";
    const text=document.getElementById("c-text").value.trim();
    if(!text){ toast("请输入评论内容","err"); return; }
    const t=state.tools.find(x=>x.id===toolId);
    state.comments.push({ id:uid(), toolId, name, text, from:t?t.name:"", time:Date.now() });
    addLog("发表评论", name+" 评论了《"+(t?t.name:"")+"》");
    save(); renderComments(toolId);
    document.getElementById("c-text").value="";
    toast("评论已发表","ok");
  };

  // 赞助下载：真实跳转 + 下载量 +1（拒绝模拟）
  window.sponsorDownload=function(id){
    const t=state.tools.find(x=>x.id===id); if(!t) return;
    if(!t.link){ toast("该工具尚未配置下载链接","err"); return; }
    // 记录跳转行为并真实打开链接
    t.downloads=(t.downloads||0)+1;
    addLog("赞助下载", "《"+t.name+"》下载量 +1（真实跳转）");
    save();
    // 刷新当前视图中的下载量
    const card=document.querySelector(`.tool-card .actions .btn-primary[onclick*="${id}"]`);
    renderTools(document.getElementById("searchInput").value.trim());
    // 真实跳转（新窗口，由用户主动点击触发，非模拟）
    window.open(t.link, "_blank", "noopener");
    toast("正在跳转下载链接…","ok");
  };

  // 搜索
  document.getElementById("searchInput").addEventListener("input", e=>renderTools(e.target.value.trim()));

  // Modal
  window.openModal=function(id){ document.getElementById(id).classList.add("show"); };
  window.closeModal=function(id){ document.getElementById(id).classList.remove("show"); };

  // Toast
  let toastT; window.toast=function(msg,type){ const t=document.getElementById("toast"); document.getElementById("toastTxt").textContent=msg; t.className="toast show "+(type||""); clearTimeout(toastT); toastT=setTimeout(()=>t.className="toast",2200); };

  // ==================== 后台管理 ====================
  window.enterAdmin=function(){
    if(sessionStorage.getItem("qx_logged")==="1"){ showAdmin(); return; }
    document.getElementById("header").style.display="none";
    document.getElementById("homeView").style.display="none";
    document.getElementById("adminView").style.display="none";
    document.getElementById("loginView").style.display="flex";
    document.getElementById("loginUser").value=""; document.getElementById("loginPass").value="";
  };
  window.doLogin=function(){
    const u=document.getElementById("loginUser").value.trim();
    const p=document.getElementById("loginPass").value;
    if(u===ADMIN_USER && p===ADMIN_PASS){ sessionStorage.setItem("qx_logged","1"); addLog("后台登录","管理员登录成功"); showAdmin(); }
    else{ toast("账号或密码错误","err"); }
  };
  window.logout=function(){ sessionStorage.removeItem("qx_logged"); addLog("后台登出","管理员已退出"); showHome(); toast("已退出登录","ok"); };
  function showAdmin(){
    document.getElementById("loginView").style.display="none";
    document.getElementById("header").style.display="flex";
    document.getElementById("homeView").style.display="none";
    document.getElementById("adminView").style.display="flex";
    switchAdmin("dash", document.querySelector(".sidebar a.active")||document.querySelector(".sidebar a"));
    renderDashboard();
  }
  window.showHome=function(){
    sessionStorage.removeItem("qx_logged");
    document.getElementById("adminView").style.display="none";
    document.getElementById("loginView").style.display="none";
    document.getElementById("header").style.display="flex";
    document.getElementById("homeView").style.display="block";
    renderTools();
  };
  window.switchAdmin=function(view, el){
    document.querySelectorAll(".sidebar a").forEach(a=>a.classList.remove("active"));
    if(el) el.classList.add("active");
    ["dash","logs","publish","tools","comments","announce"].forEach(v=>{
      const dv=document.getElementById("view-"+v); if(dv) dv.style.display=(v===view?"block":"none");
    });
    if(view==="logs") renderLogs();
    if(view==="tools") renderToolsAdmin();
    if(view==="comments") renderCommentsAdmin();
    if(view==="publish"){ resetPubForm(); document.getElementById("pubTitle").textContent="➕ 工具上架"; document.getElementById("pubBtn").textContent="发布工具"; }
    if(view==="announce") document.getElementById("f-announce").value=state.announce||"";
  };

  // 数据面板
  function renderDashboard(){
    document.getElementById("stVisits").textContent=state.visitCount;
    document.getElementById("stTools").textContent=state.tools.length;
    document.getElementById("stDowns").textContent=state.tools.reduce((s,t)=>s+(t.downloads||0),0);
    document.getElementById("stCmts").textContent=state.comments.length;
    const box=document.getElementById("recentLogs");
    if(state.logs.length===0){ box.innerHTML='<div class="empty"><div class="big">📭</div>暂无日志记录</div>'; return; }
    box.innerHTML='<table><thead><tr><th>时间</th><th>操作</th><th>详情</th></tr></thead><tbody>'+
      state.logs.slice(0,10).map(l=>`<tr><td style="white-space:nowrap;color:var(--muted);font-size:12px">${esc(l.time)}</td><td>${esc(l.action)}</td><td>${esc(l.detail||"")}</td></tr>`).join("")+
      '</tbody></table>';
  }

  // 日志
  function renderLogs(){
    const box=document.getElementById("logsTable");
    if(state.logs.length===0){ box.innerHTML='<div class="empty"><div class="big">📭</div>暂无日志</div>'; return; }
    box.innerHTML='<table><thead><tr><th>时间</th><th>操作</th><th>详情</th><th>操作</th></tr></thead><tbody>'+
      state.logs.map(l=>`<tr><td style="white-space:nowrap;color:var(--muted);font-size:12px">${esc(l.time)}</td><td>${esc(l.action)}</td><td>${esc(l.detail||"")}</td><td><button class="btn btn-danger" onclick="delLog('${l.id}')">删除</button></td></tr>`).join("")+
      '</tbody></table>';
  }
  window.delLog=function(id){ state.logs=state.logs.filter(l=>l.id!==id); save(); renderLogs(); renderDashboard(); toast("日志已删除","ok"); };
  window.clearLogs=function(){ if(!confirm("确定清空全部日志？")) return; state.logs=[]; save(); renderLogs(); renderDashboard(); toast("日志已清空","ok"); };

  // 工具上架/编辑
  let editId=null;
  window.resetPubForm=function(){
    editId=null;
    document.getElementById("pubTitle").textContent="➕ 工具上架";
    document.getElementById("pubBtn").textContent="发布工具";
    document.getElementById("f-name").value="";
    document.getElementById("f-icon").value="📦"; document.getElementById("f-iconPrev").textContent="📦";
    document.getElementById("f-link").value="";
    document.getElementById("f-readme").value="";
  };
  window.saveTool=function(){
    const name=document.getElementById("f-name").value.trim();
    const icon=document.getElementById("f-icon").value.trim()||"📦";
    const link=document.getElementById("f-link").value.trim();
    const readme=document.getElementById("f-readme").value;
    if(!name){ toast("请输入工具名称","err"); return; }
    if(!link){ toast("请填写赞助下载链接","err"); return; }
    if(editId){
      const t=state.tools.find(x=>x.id===editId); if(!t) return;
      t.name=name; t.icon=icon; t.link=link; t.readme=readme;
      addLog("修改工具","修改了《"+name+"》");
      toast("工具已更新","ok");
    }else{
      state.tools.push({ id:uid(), name, icon, link, readme, downloads:0, createdAt:Date.now() });
      addLog("上架工具","发布了《"+name+"》");
      toast("工具已发布","ok");
    }
    save(); resetPubForm(); renderTools();
  };
  window.editTool=function(id){
    const t=state.tools.find(x=>x.id===id); if(!t) return;
    editId=id;
    document.getElementById("pubTitle").textContent="✏️ 修改工具";
    document.getElementById("pubBtn").textContent="保存修改";
    document.getElementById("f-name").value=t.name;
    document.getElementById("f-icon").value=t.icon||"📦"; document.getElementById("f-iconPrev").textContent=t.icon||"📦";
    document.getElementById("f-link").value=t.link||"";
    document.getElementById("f-readme").value=t.readme||"";
    switchAdmin("publish", document.querySelector(".sidebar a[data-view='publish']"));
  };
  window.delTool=function(id){
    const t=state.tools.find(x=>x.id===id); if(!t) return;
    if(!confirm("确定删除工具《"+t.name+"》？相关评论也会一并删除。")) return;
    state.tools=state.tools.filter(x=>x.id!==id);
    state.comments=state.comments.filter(c=>c.toolId!==id);
    addLog("删除工具","删除了《"+t.name+"》");
    save(); renderToolsAdmin(); renderTools(); renderDashboard(); toast("工具已删除","ok");
  };
  function renderToolsAdmin(){
    const box=document.getElementById("toolsTable");
    if(state.tools.length===0){ box.innerHTML='<div class="empty"><div class="big">📭</div>暂无工具</div>'; return; }
    box.innerHTML='<table><thead><tr><th>图标</th><th>名称</th><th>下载量</th><th>发布时间</th><th>操作</th></tr></thead><tbody>'+
      state.tools.slice().sort((a,b)=>b.createdAt-a.createdAt).map(t=>`<tr><td style="font-size:24px">${esc(t.icon||"📦")}</td><td>${esc(t.name)}</td><td>${t.downloads||0}</td><td style="color:var(--muted);font-size:12px">${fmtDate(t.createdAt)}</td><td><button class="btn" onclick="editTool('${t.id}')">修改</button> <button class="btn btn-danger" onclick="delTool('${t.id}')">删除</button></td></tr>`).join("")+
      '</tbody></table>';
  }

  // 评论管理
  function renderCommentsAdmin(){
    const box=document.getElementById("commentsTable");
    if(state.comments.length===0){ box.innerHTML='<div class="empty"><div class="big">💬</div>暂无评论</div>'; return; }
    box.innerHTML='<table><thead><tr><th>用户</th><th>来源工具</th><th>内容</th><th>时间</th><th>操作</th></tr></thead><tbody>'+
      state.comments.slice().sort((a,b)=>b.time-a.time).map(c=>`<tr><td><b>${esc(c.name||"匿名")}</b></td><td>${esc(c.from||"")}</td><td style="max-width:360px;white-space:pre-wrap">${esc(c.text)}</td><td style="color:var(--muted);font-size:12px;white-space:nowrap">${fmtDate(c.time)}</td><td><button class="btn btn-danger" onclick="delComment('${c.id}')">删除</button></td></tr>`).join("")+
      '</tbody></table>';
  }
  window.delComment=function(id){ state.comments=state.comments.filter(c=>c.id!==id); save(); renderCommentsAdmin(); renderDashboard(); toast("评论已删除","ok"); };

  // 公告
  window.saveAnnounce=function(){
    state.announce=(document.getElementById("f-announce").value||"").trim();
    save(); addLog("编辑公告", state.announce?("更新了首页公告"):"清空了首页公告");
    toast("公告已保存","ok"); renderAnnounce();
  };
  function renderAnnounce(){
    const box=document.getElementById("announceBox"); const t=state.announce&&state.announce.trim();
    if(!t){ box.style.display="none"; return; }
    box.style.display="flex"; document.getElementById("announceTxt").textContent=t;
  }

  // 启动
  tickVisit();
  document.getElementById("footYear").textContent=new Date().getFullYear();
  renderAnnounce(); renderTools();
  // 已登录则直接进后台
  if(sessionStorage.getItem("qx_logged")==="1"){ showAdmin(); }
  else{ document.getElementById("header").style.display="flex"; }
})();
</script>
</body>
</html>
